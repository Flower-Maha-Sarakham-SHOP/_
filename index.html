<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>แบบทดสอบก่อนเรียน · จรรยาบรรณวิชาชีพครู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK - simple <script> tags, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0A1930; --bg2:#071122; --surface:#122A4C; --surface2:#1B3A66;
    --chalk:#EAF3FF; --chalk-dim:#93AFD6; --gold:#38BDF8; --coral:#F2705C;
    --sky:#60E1FF; --violet:#8B9EFF; --line: rgba(234,243,255,0.14);
    --accent2:#2563EB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 20% -10%, rgba(96,225,255,0.10), transparent 45%), radial-gradient(ellipse at 90% 10%, rgba(37,99,235,0.12), transparent 40%), var(--bg);
    color:var(--chalk); font-family:'Sarabun',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px 48px;width:100%;}
  h1,h2,h3{font-family:'Kanit',sans-serif;margin:0;word-break:break-word;overflow-wrap:break-word;}
  h1{font-size:clamp(22px,6vw,32px);}
  h2{font-size:clamp(19px,5vw,26px);}
  p,.muted,.pill,.qtag{overflow-wrap:break-word;word-break:break-word;}
  .wrap{width:100%;max-width:720px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
  @media (max-width:420px){
    #root{padding:16px 12px 36px;}
    .card{padding:20px 16px;border-radius:14px;}
    .btn{font-size:15px;padding:13px 16px;}
    .choice-btn{font-size:14px;padding:14px 12px;}
    .pod-col{width:80px;}
    .pod-name{max-width:80px;font-size:12px;}
  }
  .btn{font-family:'Kanit',sans-serif;font-weight:600;font-size:17px;border:none;border-radius:14px;padding:14px 22px;cursor:pointer;color:var(--bg2);background:var(--gold);transition:transform .12s ease, filter .12s ease;width:100%;}
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn:active{transform:translateY(0px) scale(.99);}
  .btn.secondary{background:transparent;color:var(--chalk);border:1.5px dashed var(--line);}
  .btn.coral{background:var(--coral);color:var(--bg2);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  input[type=text]{width:100%;font-family:'Sarabun',sans-serif;font-size:17px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--chalk);outline:none;}
  input[type=text]:focus{border-color:var(--gold);}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .muted{color:var(--chalk-dim);font-size:14px;}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--chalk-dim);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .dot.red{background:var(--coral);}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg, rgba(56,189,248,0.18), rgba(96,225,255,0.10));
    border:1px solid rgba(56,189,248,0.38);
    color:var(--gold);
    padding:7px 16px;border-radius:999px;font-family:'Kanit',sans-serif;
    font-size:13px;font-weight:600;letter-spacing:.2px;
  }
  .univ-logo{width:64px;height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 4px 14px rgba(56,189,248,0.25));}
  .credit{font-size:12px;color:var(--chalk-dim);opacity:.75;margin-top:26px;}
  .credit b{color:var(--chalk-dim);font-weight:600;}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.10) 1px, transparent 0),
      radial-gradient(1px 1px at 78% 65%, rgba(255,255,255,0.08) 1px, transparent 0),
      radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,0.07) 1px, transparent 0),
      radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.06) 1px, transparent 0);
    background-size:400px 400px;
  }
  #root{position:relative;z-index:1;}
  .center{text-align:center;}
  .top-space{margin-top:18px;}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
  .logo svg{width:38px;height:38px;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
  @media (max-width:520px){.choices{grid-template-columns:1fr;}}
  .choice-btn{font-family:'Kanit',sans-serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:12px;padding:18px 16px;border-radius:14px;border:none;cursor:pointer;color:#08172E;text-align:left;transition:transform .1s ease, filter .1s ease, opacity .2s ease;}
  .choice-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
  .choice-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .choice-shape{width:26px;height:26px;flex:none;}
  .c0{background:var(--coral);} .c1{background:var(--sky);} .c2{background:var(--gold);} .c3{background:var(--violet);}
  .timerbar-outer{height:10px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:16px;border:1px solid var(--line);}
  .timerbar-inner{height:100%;background:var(--gold);border-radius:999px;transition:width .2s linear;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:10px 0;}
  .bar-label{width:26px;height:26px;border-radius:8px;flex:none;}
  .bar-track{flex:1;background:var(--bg2);border-radius:8px;height:26px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;border-radius:8px;transition:width .5s ease;}
  .bar-count{width:42px;text-align:right;font-family:'Kanit',sans-serif;font-weight:600;}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:28px 0 8px;}
  .pod-col{display:flex;flex-direction:column;align-items:center;gap:8px;width:100px;}
  .pod-bar{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:'Kanit',sans-serif;font-weight:800;font-size:22px;color:#08172E;}
  .pod-name{font-family:'Kanit',sans-serif;font-weight:600;font-size:14px;text-align:center;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pod-score{font-size:12px;color:var(--chalk-dim);}
  .roster{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .chip{background:var(--bg2);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:13px;}
  .feedback{text-align:center;padding:22px 18px;border-radius:16px;margin-top:16px;}
  .feedback.ok{background:rgba(245,198,76,0.15);border:1.5px solid var(--gold);}
  .feedback.no{background:rgba(242,112,92,0.15);border:1.5px solid var(--coral);}
  .qtag{font-size:13px;color:var(--chalk-dim);margin-bottom:4px;}
  .hostbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
  code{background:var(--bg2);padding:2px 6px;border-radius:6px;font-size:13px;}
  ::selection{background:var(--gold);color:#08172E;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============ 1) แก้คำถามของคุณตรงนี้ (10 ข้อ, choices 4 ข้อ, correct = index ที่ถูก 0-3) ============ */
const QUESTIONS = [
  { q: "นักเรียนทำผิดระเบียบร้ายแรง แต่นายอำเภอขอให้ละเว้นโทษ ครูควรตัดสินใจอย่างไรจึงจะถูกต้องที่สุด?", choices: ["ละเว้นโทษเฉพาะกรณีนี้เพื่อรักษาความสัมพันธ์กับชุมชน","ลงโทษตามระเบียบโรงเรียนอย่างเท่าเทียมและตรงไปตรงมา","ให้ผู้ปกครองนำเด็กย้ายโรงเรียนเงียบๆ เพื่อจบปัญหา","ส่งเรื่องให้สภาผู้ปกครองพิจารณาตัดสินโทษแทนครู"], correct: 1 },
  { q: "ครูโพสต์ตำหนิกระทรวงฯ เรื่องภาระงานครูอย่างมีเหตุผลแต่ใช้ภาษารุนแรง ถือว่าผิดหลักใดชัดเจนที่สุด?", choices: ["จรรยาบรรณต่อตนเอง","จรรยาบรรณต่อวิชาชีพ","จรรยาบรรณต่อผู้รับบริการ","จรรยาบรรณต่อสังคม"], correct: 0 },
  { q: "เพื่อนครูขโมยเงินห้องเรียนไปรักษาลูกที่ป่วยวิกฤต การกระทำแรกที่ครูควรทำตามจรรยาบรรณคือข้อใด?", choices: ["ช่วยออกเงินคืนห้องเรียนเพื่อปกป้องเพื่อน","รายงานผู้บริหารตามข้อเท็จจริงทันที","ตักเตือนให้เพื่อนนำเงินมาคืนและแจ้งผู้บริหาร","ไกล่เกลี่ยให้เพื่อนผ่อนชำระคืนโดยไม่รายงาน"], correct: 2 },
  { q: "ครูนำงานวิจัยของตนเองที่ทำเสร็จในเวลาราชการไปขายให้บริษัทเอกชนถือว่าผิดหลักใดเป็นหลัก?", choices: ["ซื่อสัตย์สุจริตต่อหน้าที่","ความก้าวหน้าทางวิชาการ","ความเมตตากรุณาต่อผู้เรียน","การเป็นผู้นำทางสังคม"], correct: 0 },
  { q: "ครูสงสัยว่าเด็กถูกทารุณกรรมจากผู้ปกครอง แต่นักเรียนไหว้วานขอไม่ให้บอกใคร ครูควรทำอย่างไร?", choices: ["เคารพสิทธิของเด็กและแอบช่วยเหลือเงียบๆ","แจ้งผู้บริหารและหน่วยงานที่คุ้มครองเด็กทันที","เรียกผู้ปกครองมาตักเตือนและคาดโทษไว้ก่อน","รอสังเกตพฤติกรรมและรวบรวมหลักฐานเพิ่ม"], correct: 1 },
  { q: "ครูสอนพิเศษนอกเวลาให้นักเรียนตนเอง โดยใช้ข้อสอบเก่าย้อนหลัง 5 ปีมาติวให้ ถือว่าผิดจรรยาบรรณหรือไม่?", choices: ["ไม่ผิด เพราะเป็นการขยันติวข้อสอบเก่า","ไม่ผิด เพราะเป็นเวลานอกราชการ","ผิด เพราะเข้าข่ายแสวงประโยชน์และเหลื่อมล้ำ","ผิด เพราะนำเอกสารราชการมาใช้ส่วนตัว"], correct: 2 },
  { q: "ครูพบว่าข้อมูลในตำราเรียนของกระทรวงฯ มีจุดผิดพลาดร้ายแรง ควรจัดการอย่างไรตามจรรยาบรรณ?", choices: ["ข้ามเนื้อหาจุดนั้นไปและไม่เก็บมาออกข้อสอบ","สอนตามตำราเดิมเพื่อไม่ให้นักเรียนสับสน","สอนเนื้อหาที่ถูกต้องและแจ้งแก้ไขตามขั้นตอน","ให้เด็กไปศึกษาค้นคว้าเองนอกเวลาเรียน"], correct: 2 },
  { q: "ครูถูกข่มขู่ว่าจะโดนทำร้ายหากไม่ปล่อยเกรดนักเรียนกลุ่มหนึ่ง ครูควรตัดสินใจอย่างไร?", choices: ["ยอมปรับคะแนนเพื่อรักษาชีวิตตนเองไว้ก่อน","รายงานผู้บริหารและตำรวจ พร้อมให้คะแนนตามจริง","ปรับเกรดให้ชั่วคราวแล้วค่อยยื่นเรื่องร้องเรียน","ให้โอกาสนักเรียนสอบใหม่ด้วยข้อสอบที่ง่ายลง"], correct: 1 },
  { q: "ชุมชนมีความเชื่อเรื่องพิธีกรรมที่ขัดต่อสุขอนามัยอย่างรุนแรง ครูควรวางตัวอย่างไรจึงเหมาะสมที่สุด?", choices: ["นำเสนอความรู้ทางวิทยาศาสตร์อย่างประนีประนอม","วางตัวเป็นกลางและปล่อยให้เป็นเรื่องของชุมชน","เข้าร่วมพิธีกรรมเพื่อสร้างความสัมพันธ์ที่ดี","โพสต์เตือนภัยลงโซเชียลเพื่อระงับพิธีกรรม"], correct: 0 },
  { q: "ข้อใดถือเป็น \"ศรัทธาในวิชาชีพครู\" ที่ถูกต้องตามหลักจรรยาบรรณมากที่สุด?", choices: ["มุ่งมั่นพัฒนาตนเองเพื่อให้อาชีพครูได้รับการยอมรับ","ภาคภูมิใจในอาชีพและทุ่มเทพัฒนาผู้เรียนเต็มกำลัง","ปฏิบัติหน้าที่ครูอย่างเคร่งครัดตามเวลาราชการ","ปกป้องชื่อเสียงของครูทุกกรณีไม่ให้ใครมาดูถูก"], correct: 1 }
];

}

function renderHostAuth(){
  root.innerHTML = `
    <div class="wrap">
      <div class="card stack">
        <h2 class="center">ยืนยันตัวตนผู้คุมเกม</h2>
        <p class="muted center">ตอบโจทย์นี้เพื่อเข้าสู่หน้าจอผู้คุมเกม</p>
        <p class="center" style="font-family:'Kanit',sans-serif;font-size:22px;font-weight:700;">${HOST_QUESTION}</p>
        <input type="text" id="codeInput" placeholder="พิมพ์คำตอบ..." autofocus>
        <button class="btn" id="confirmBtn">ยืนยัน</button>
        <button class="btn secondary" id="backBtn">← ย้อนกลับ</button>
      </div>
    </div>`;
  document.getElementById('backBtn').onclick = renderLanding;
  const inp = document.getElementById('codeInput');
  const submit = ()=>{
    const val = (inp.value||'').trim();
    if(val === HOST_ANSWER){
      role = 'host';
      enterHost();
    } else {
      // wrong code -> bounce into player mode instead
      role = 'player';
      renderJoinForm(true);
    }
  };
  document.getElementById('confirmBtn').onclick = submit;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ---------------- PLAYER: JOIN ---------------- */
function renderJoinForm(wrongCode){
  root.innerHTML = `
    <div class="wrap">
      <div class="card stack">
        ${wrongCode ? '<p class="pill"><span class="dot red"></span> รหัสไม่ถูกต้อง เข้าสู่โหมดผู้เล่นแทน</p>' : ''}
        <h2 class="center">เข้าร่วมเกม</h2>
        <p class="muted center">พิมพ์ชื่อของคุณเพื่อเข้าร่วม</p>
        <input type="text" id="nameInput" maxlength="20" placeholder="ชื่อเล่นของคุณ..." autofocus>
        <button class="btn" id="joinBtn">เข้าร่วม</button>
        <button class="btn secondary" id="backBtn">← ย้อนกลับ</button>
      </div>
    </div>`;
  const inp = document.getElementById('nameInput');
  document.getElementById('backBtn').onclick = renderLanding;
  document.getElementById('joinBtn').onclick = ()=>{
    const name = inp.value.trim();
    if(!name){ inp.focus(); return; }
    playerName = name;
    playerId = uid();
    db.ref('quiz/players/'+playerId).set({ name, score:0, joinedAt: Date.now() });
    attachListeners();
  };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('joinBtn').click(); });
}

/* ---------------- HOST ENTRY ---------------- */
function enterHost(){
  db.ref('quiz/session').once('value', snap=>{
    if(!snap.exists()){
      db.ref('quiz/session').set(session);
    }
    attachListeners();
  });
}

/* ---------------- REALTIME LISTENERS (shared by host + player) ---------------- */
function attachListeners(){
  db.ref('quiz/session').on('value', snap=>{
    session = snap.val() || { phase:'lobby', qIndex:-1, qStartedAt:null, timeLimitMs:TIME_LIMIT_MS };
    onSessionChange();
  });
  db.ref('quiz/players').on('value', snap=>{
    playersMap = snap.val() || {};
    render();
  });
}

function onSessionChange(){
  if(currentAnswersRef) currentAnswersRef.off();
  if(session.qIndex >= 0){
    currentAnswersRef = db.ref('quiz/answers/'+session.qIndex);
    currentAnswersRef.on('value', snap=>{
      currentQAnswers = snap.val() || {};
      render();
    });
  } else {
    currentQAnswers = {};
  }
  render();
}

function render(){
  if(role === 'host') renderHost();
  else if(role === 'player') renderPlayerScreen();
}

/* ---------------- SHAPES ---------------- */
const SHAPES = [
  `<svg viewBox="0 0 26 26" class="choice-shape"><polygon points="13,3 24,23 2,23" fill="#08172E"/></svg>`,
  `<svg viewBox="0 0 26 26" class="choice-shape"><polygon points="13,2 24,13 13,24 2,13" fill="#08172E"/></svg>`,
  `<svg viewBox="0 0 26 26" class="choice-shape"><circle cx="13" cy="13" r="11" fill="#08172E"/></svg>`,
  `<svg viewBox="0 0 26 26" class="choice-shape"><polygon points="13,1 16,10 25,10 17.5,15.5 20,24 13,19 6,24 8.5,15.5 1,10 10,10" fill="#08172E"/></svg>`
];
const CCLASS = ['c0','c1','c2','c3'];

/* ---------------- PLAYER VIEW ---------------- */
function renderPlayerScreen(){
  stopTick();
  if(session.phase === 'lobby'){
    root.innerHTML = `
      <div class="wrap center">
        <div class="card">
          <div class="pill"><span class="dot"></span> เชื่อมต่อแล้ว</div>
          <h2 class="top-space">สวัสดี ${escapeHtml(playerName)} 👋</h2>
          <p class="muted">รอผู้คุมเกมเริ่มเกม...</p>
        </div>
      </div>`;
    return;
  }
  if(session.phase === 'active'){
    const q = QUESTIONS[session.qIndex];
    const mine = currentQAnswers[playerId];
    const started = session.qStartedAt || Date.now();
    const initPct = Math.max(0, Math.min(100, ((session.timeLimitMs-(Date.now()-started))/session.timeLimitMs)*100));
    root.innerHTML = `
      <div class="wrap">
        <div class="qtag">ข้อ ${session.qIndex+1} / ${QUESTIONS.length}</div>
        <h2>${escapeHtml(q.q)}</h2>
        <div class="timerbar-outer"><div class="timerbar-inner" id="tbar" style="width:${initPct}%"></div></div>
        <div class="choices" id="choiceWrap">
          ${q.choices.map((c,i)=>`
            <button class="choice-btn ${CCLASS[i]}" data-i="${i}" ${mine?'disabled':''}>
              ${SHAPES[i]} <span>${escapeHtml(c)}</span>
            </button>`).join('')}
        </div>
        ${mine ? '<p class="muted center top-space">✅ ส่งคำตอบแล้ว รอผลลัพธ์...</p>' : ''}
      </div>`;
    if(!mine){
      document.querySelectorAll('#choiceWrap .choice-btn').forEach(btn=>{
        btn.onclick = ()=>{
          document.querySelectorAll('#choiceWrap .choice-btn').forEach(b=>b.disabled=true);
          const i = parseInt(btn.dataset.i,10);
          const ms = Math.min(session.timeLimitMs, Math.max(0, Date.now()-started));
          const correct = i === q.correct;
          const points = correct ? 1 : 0; // ตอบถูกได้ข้อละ 1 คะแนน
          db.ref('quiz/answers/'+session.qIndex+'/'+playerId).set({choice:i, correct, points, ms});
          db.ref('quiz/players/'+playerId+'/score').transaction(cur=>(cur||0)+points);
        };
      });
    }
    tickTimer = setInterval(()=>{
      const el = document.getElementById('tbar');
      if(!el) return;
      const pct = Math.max(0, 100 - ((Date.now()-started)/session.timeLimitMs)*100);
      el.style.width = pct+'%';
    }, 150);
    return;
  }
  if(session.phase === 'reveal'){
    const q = QUESTIONS[session.qIndex];
    const mine = currentQAnswers[playerId];
    const myScore = (playersMap[playerId] && playersMap[playerId].score) || 0;
    const ok = mine && mine.correct;
    root.innerHTML = `
      <div class="wrap">
        <div class="qtag">เฉลย ข้อ ${session.qIndex+1} / ${QUESTIONS.length}</div>
        <h3>${escapeHtml(q.q)}</h3>
        <p class="muted">คำตอบที่ถูกคือ: <b style="color:var(--gold)">${escapeHtml(q.choices[q.correct])}</b></p>
        <div class="feedback ${mine ? (ok?'ok':'no') : 'no'}">
          <h2 style="margin-bottom:6px;">${mine ? (ok?'✅ ถูกต้อง!':'❌ ไม่ถูกต้อง') : '⏱️ ไม่ได้ตอบ'}</h2>
          <p class="muted">${mine ? `ได้ ${mine.points} คะแนนรอบนี้` : 'ได้ 0 คะแนนรอบนี้'}</p>
          <p style="margin-top:10px;font-family:'Kanit',sans-serif;font-weight:700;font-size:20px;">คะแนนรวม: ${myScore}</p>
        </div>
      </div>`;
    return;
  }
  if(session.phase === 'final'){
    const all = Object.entries(playersMap).map(([id,p])=>({id,...p})).sort((a,b)=>b.score-a.score);
    const myRank = all.findIndex(p=>p.id===playerId)+1;
    const me = playersMap[playerId] || {score:0};
    root.innerHTML = `
      <div class="wrap center">
        <div class="card">
          <h2>🏁 จบเกม!</h2>
          <p class="muted">อันดับของคุณ</p>
          <div style="font-family:'Kanit',sans-serif;font-weight:800;font-size:48px;color:var(--gold);">#${myRank||'-'}</div>
          <p>${escapeHtml(playerName)} · ${me.score||0} คะแนน</p>
          ${myRank && myRank<=3 ? '<p style="color:var(--gold);font-weight:700;">🎉 ยินดีด้วย คุณติด Top 3!</p>' : ''}
        </div>
        <p class="credit">จัดทำโดย <b>นางสาว กิตติยาภรณ์ บรรลือ</b></p>
      </div>`;
    return;
  }
}

/* ---------------- HOST VIEW ---------------- */
function renderHost(){
  stopTick();
  const playerList = Object.values(playersMap);

  if(session.phase === 'lobby'){
    root.innerHTML = `
      <div class="wrap">
        <div class="card center">
          <img src="${UNIV_LOGO}" alt="ตรามหาวิทยาลัยราชภัฏมหาสารคาม" class="univ-logo">
          <h2>ห้องพร้อมแล้ว 🖊️</h2>
          <p class="muted"><ให้เพื่อนๆ เปิดลิงก์นี้บนมือถือแล้วกด "เข้าร่วมเป็นผู้เล่น>"</p>
          <div class="pill top-space"><span class="dot"></span> ผู้เล่นเข้าร่วมแล้ว ${playerList.length} คน</div>
          <div class="roster">
            ${playerList.map(p=>`<span class="chip">${escapeHtml(p.name)}</span>`).join('') || '<span class="muted">ยังไม่มีผู้เล่น...</span>'}
          </div>
          <button class="btn top-space" id="startBtn" ${playerList.length===0?'disabled':''}>▶️ เริ่มเกม</button>
          <button class="btn secondary top-space" id="wipeBtn">🔄 ล้างผู้เล่นทั้งหมด (เริ่มห้องใหม่)</button>
        </div>
      </div>`;
    document.getElementById('startBtn').onclick = ()=>{
      db.ref('quiz/session').set({phase:'active', qIndex:0, qStartedAt:Date.now(), timeLimitMs:TIME_LIMIT_MS});
    };
    document.getElementById('wipeBtn').onclick = ()=>{
      db.ref('quiz/players').remove();
      db.ref('quiz/answers').remove();
      db.ref('quiz/session').set({phase:'lobby', qIndex:-1, qStartedAt:null, timeLimitMs:TIME_LIMIT_MS});
    };
    return;
  }

  if(session.phase === 'active'){
    const q = QUESTIONS[session.qIndex];
    const answeredCount = Object.keys(currentQAnswers).length;
    const started = session.qStartedAt || Date.now();
    const initPct = Math.max(0, Math.min(100, ((session.timeLimitMs-(Date.now()-started))/session.timeLimitMs)*100));
    root.innerHTML = `
      <div class="wrap">
        <div class="qtag">ข้อ ${session.qIndex+1} / ${QUESTIONS.length}</div>
        <h2>${escapeHtml(q.q)}</h2>
        <div class="choices">
          ${q.choices.map((c,i)=>`<div class="choice-btn ${CCLASS[i]}" style="pointer-events:none;">${SHAPES[i]}<span>${escapeHtml(c)}</span></div>`).join('')}
        </div>
        <div class="timerbar-outer"><div class="timerbar-inner" id="tbar" style="width:${initPct}%"></div></div>
        <div class="hostbar">
          <div class="pill"><span class="dot"></span> ตอบแล้ว ${answeredCount} / ${playerList.length} คน</div>
          <button class="btn coral" id="revealBtn" style="width:auto;">🔔 เฉลยตอนนี้</button>
        </div>
      </div>`;
    document.getElementById('revealBtn').onclick = ()=>{
      db.ref('quiz/session').update({phase:'reveal'});
    };
    tickTimer = setInterval(()=>{
      const el = document.getElementById('tbar');
      const remain = session.timeLimitMs - (Date.now()-started);
      if(el) el.style.width = Math.max(0,(remain/session.timeLimitMs)*100)+'%';
      if(remain<=0){
        clearInterval(tickTimer);
        db.ref('quiz/session').update({phase:'reveal'});
      }
    }, 150);
    return;
  }

  if(session.phase === 'reveal'){
    const q = QUESTIONS[session.qIndex];
    const answers = Object.values(currentQAnswers);
    const counts = [0,0,0,0];
    answers.forEach(a=>{ if(a.choice>=0 && a.choice<4) counts[a.choice]++; });
    const total = answers.length || 1;
    const correctCount = answers.filter(a=>a.correct).length;
    const isLast = session.qIndex >= QUESTIONS.length-1;
    root.innerHTML = `
      <div class="wrap">
        <div class="qtag">เฉลย ข้อ ${session.qIndex+1} / ${QUESTIONS.length}</div>
        <h2>${escapeHtml(q.q)}</h2>
        <p class="muted">คำตอบที่ถูก: <b style="color:var(--gold)">${escapeHtml(q.choices[q.correct])}</b> · ตอบถูก ${correctCount}/${answers.length} คน</p>
        <div class="top-space">
          ${q.choices.map((c,i)=>`
            <div class="bar-row">
              <div class="bar-label ${CCLASS[i]}"></div>
              <div class="bar-track"><div class="bar-fill" style="width:${(counts[i]/total)*100}%; background:${i===q.correct?'var(--gold)':'var(--surface2)'};"></div></div>
              <div class="bar-count">${counts[i]}</div>
            </div>`).join('')}
        </div>
        <button class="btn top-space" id="nextBtn">${isLast? '🏆 ประกาศผู้ชนะ' : '➡️ ข้อถัดไป'}</button>
      </div>`;
    document.getElementById('nextBtn').onclick = ()=>{
      if(isLast){
        db.ref('quiz/session').update({phase:'final'});
      } else {
        db.ref('quiz/session').set({phase:'active', qIndex:session.qIndex+1, qStartedAt:Date.now(), timeLimitMs:TIME_LIMIT_MS});
      }
    };
    return;
  }

  if(session.phase === 'final'){
    const all = playerList.slice().sort((a,b)=>b.score-a.score);
    const top3 = all.slice(0,3);
    const rest = all.slice(3);
    // ลำดับการวางบนแท่น (ซ้ายไปขวา) — อันดับ 1 อยู่กลาง, ความสูงยึดตามอันดับจริงเสมอ ไม่ใช่ตำแหน่งที่วาง
    const order = top3.length===3 ? [1,0,2] : top3.map((_,i)=>i);
    const heightsByRank = [170,130,100]; // ดัชนี 0=อันดับ1(สูงสุด), 1=อันดับ2, 2=อันดับ3
    const colorsByRank = ['var(--gold)','var(--sky)','var(--coral)'];
    root.innerHTML = `
      <div class="wrap center">
        <h2>🏆 ผู้ชนะ Top 3</h2>
        <div class="podium">
          ${order.map((idx)=>{
            const p = top3[idx];
            if(!p) return '';
            return `<div class="pod-col">
              <div class="pod-name">${escapeHtml(p.name)}</div>
              <div class="pod-score">${p.score} คะแนน</div>
              <div class="pod-bar" style="height:${heightsByRank[idx]}px; background:${colorsByRank[idx]};">#${idx+1}</div>
            </div>`;
          }).join('')}
        </div>
        ${rest.length ? `<div class="card top-space" style="text-align:left;">
          <p class="muted">อันดับอื่นๆ</p>
          ${rest.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);"><span>#${i+4} ${escapeHtml(p.name)}</span><b>${p.score}</b></div>`).join('')}
        </div>` : ''}
        <button class="btn secondary top-space" id="resetBtn">🔄 เริ่มเกมใหม่ (ล้างข้อมูลทั้งหมด)</button>
        <p class="credit">จัดทำโดย <b>นางสาว กิตติยาภรณ์ บรรลือ</b></p>
      </div>`;
    document.getElementById('resetBtn').onclick = ()=>{
      db.ref('quiz/players').remove();
      db.ref('quiz/answers').remove();
      db.ref('quiz/session').set({phase:'lobby', qIndex:-1, qStartedAt:null, timeLimitMs:TIME_LIMIT_MS});
    };
    return;
  }
}

function stopTick(){ clearInterval(tickTimer); }

/* ---------------- BOOT ---------------- */
if(!isConfigured){
  renderSetupNeeded();
} else {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  renderLanding();
}
</script>
</body>
</html>
